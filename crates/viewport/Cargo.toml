[package]
name = "viewport"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"
repository.workspace = true
description = "A Wayland compositor whose shell is a web page"

[[bin]]
name = "viewport"
path = "src/main.rs"

[features]
default = []
wpe = ["viewport-web/wpe"]

[dependencies]
xcursor = "0.3"
viewport-ipc.workspace = true
viewport-web.workspace = true
viewport-vulkan = { path = "../viewport-vulkan" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[build-dependencies]
pkg-config = "0.3"

[dev-dependencies]
serde_json.workspace = true

# Pinned to a revision rather than the 0.7.0 release: the release predates the
# dispatch2 rework, and the API this code is written against is the one in the
# tree — `delegate_dispatch2!`, `backend.bind()` returning a framebuffer, and
# `render_output` taking one. Bump deliberately, not automatically.
[dependencies.smithay]
git = "https://github.com/Smithay/smithay.git"
rev = "39cd5f19d0d17f0dbb9cdf2639fc114cb00c3738"
default-features = false
features = [
    "backend_winit",
    "wayland_frontend",
    "desktop",
    "renderer_gl",
    # The real backend: DRM/KMS for output, libinput for input, udev to find
    # the devices, and libseat so none of it needs to be root.
    "backend_drm",
    "backend_gbm",
    "backend_libinput",
    "backend_udev",
    "backend_session_libseat",
]
