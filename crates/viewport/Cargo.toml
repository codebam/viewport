[package]
name = "viewport"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"
repository.workspace = true
description = "A Wayland compositor whose shell is a web page"

[[bin]]
name = "viewport"
path = "src/main.rs"

[features]
default = []
wpe = ["viewport-web/wpe"]

[dependencies]
xcursor = "0.3"
viewport-ipc.workspace = true
viewport-web.workspace = true
viewport-vulkan = { path = "../viewport-vulkan" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api", "p2p"] }
zvariant = "5"
# The screencast portal streams frames through PipeWire, which is how every
# consumer of one expects to receive them — a browser, OBS, a recorder.
pipewire = "0.9"
# The screencast portal answers on the bus thread and the answer is a person
# choosing what to share, so the wait has to yield rather than block: a blocked
# executor is a desktop whose settings and session calls stop with it.
async-channel = "2"

[build-dependencies]
pkg-config = "0.3"

[dev-dependencies]
serde_json.workspace = true

# Pinned to a revision rather than the 0.7.0 release: the release predates the
# dispatch2 rework, and the API this code is written against is the one in the
# tree — `delegate_dispatch2!`, `backend.bind()` returning a framebuffer, and
# `render_output` taking one. Bump deliberately, not automatically.
[dependencies.smithay]
# A fork, for one patch: DrmCompositor::set_allow_tearing, without which
# tearing-control-v1 is a protocol the compositor can advertise and never
# honour — the async flip flag lives inside the atomic commit smithay
# builds, and nothing upstream reaches it.
git = "https://github.com/codebam/smithay.git"
rev = "5832d866c35464f22277b5de3a023176d066b0c6"
default-features = false
features = [
    "backend_winit",
    "wayland_frontend",
    "desktop",
    "renderer_gl",
    # The real backend: DRM/KMS for output, libinput for input, udev to find
    # the devices, and libseat so none of it needs to be root.
    "backend_drm",
    "backend_gbm",
    "backend_libinput",
    "backend_udev",
    "backend_session_libseat",
    # X11 applications, through Xwayland. Not optional in practice: the
    # holdouts are the ones people cannot replace.
    "xwayland",
]
