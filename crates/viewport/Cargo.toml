[package]
name = "viewport"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"
repository.workspace = true
description = "A Wayland compositor whose shell is a web page"

[[bin]]
name = "viewport"
path = "src/main.rs"

[features]
default = []
wpe = ["viewport-web/wpe"]

[dependencies]
xcursor = "0.3"
viewport-ipc.workspace = true
viewport-web.workspace = true
viewport-vulkan.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api", "p2p"] }
zvariant = "5"
# For one type: the bit flags a bus name is asked for with. zbus takes them as
# `BitFlags<RequestNameFlags>` and does not re-export the crate that defines
# it, so naming that type — which `notification.rs` does, to keep the choice of
# flags in one tested place — needs it here. Already in the tree as zbus's own
# dependency, at the version zbus pins.
enumflags2 = "0.7"
# The screencast portal streams frames through PipeWire, which is how every
# consumer of one expects to receive them — a browser, OBS, a recorder.
#
# And notification sounds, which go out through the same library — see
# src/sound.rs. That is why there is no libcanberra here: playing a short
# sound is a PipeWire stream, and this compositor already links PipeWire.
pipewire = "0.9"
# Decoding the sound a notification plays. Pure Rust, and only the formats a
# sound theme actually ships: Vorbis in Ogg is what every `.oga` in
# /usr/share/sounds is, and the rest are `.wav`.
symphonia = { version = "0.6", default-features = false, features = ["ogg", "vorbis", "wav", "pcm"] }
# The screencast portal answers on the bus thread and the answer is a person
# choosing what to share, so the wait has to yield rather than block: a blocked
# executor is a desktop whose settings and session calls stop with it.
async-channel = "2"
# For `_exit` alone: leaving without running C's exit handlers, because the
# web engine's own teardown aborts when it runs. See `main`. Already in the
# tree by way of `viewport-vulkan`.
libc = "0.2"

# The one place this compositor is a Wayland *client*: nested, it asks its host
# to hold its own keyboard shortcuts back while the nested window has the
# keyboard. See src/capture.rs — without it a compositor inside a compositor
# never sees Mod4+anything.
[dependencies.wayland-client]
version = "0.31"

[dependencies.wayland-protocols]
version = "0.32"
features = ["client", "staging"]

# To get at winit's `wl_display` and `wl_surface`, which is what that request
# names. winit re-exports the same version; naming it here keeps the two from
# resolving to different crates and handing back handles of a type this cannot
# read.
[dependencies.raw-window-handle]
version = "0.6"

[build-dependencies]
pkg-config = "0.3"

[dev-dependencies]
# For `examples/workspaces.rs`, which is a client rather than the compositor:
# what an external bar sees through ext-workspace-v1. The client crates
# themselves are ordinary dependencies now — see the note above them.
serde_json.workspace = true

# The fork and the revision are in the workspace manifest, which also carries
# the `[patch]` that points `viewport-vulkan`'s upstream Smithay at the same
# one. Only the features are this crate's.
[dependencies.smithay]
workspace = true
features = [
    "backend_winit",
    "wayland_frontend",
    "desktop",
    "renderer_gl",
    # The real backend: DRM/KMS for output, libinput for input, udev to find
    # the devices, and libseat so none of it needs to be root.
    "backend_drm",
    "backend_gbm",
    "backend_libinput",
    "backend_udev",
    "backend_session_libseat",
    # X11 applications, through Xwayland. Not optional in practice: the
    # holdouts are the ones people cannot replace.
    "xwayland",
    # The EI server the RemoteDesktop portal's ConnectToEIS hands out — see
    # src/libei.rs. Smithay's wrapper is what makes that a small piece of
    # work rather than a second wire protocol written here: it turns a libei
    # socket into a calloop event source whose events are the same
    # `InputEvent`s libinput produces, so a remote pointer is routed by the
    # code a real one is routed by. The feature costs no new dependency —
    # `reis`, which it is a wrapper around, is already in the tree as one of
    # smithay's own and is built either way.
    "backend_libei",
]
