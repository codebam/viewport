[package]
name = "viewport-web"
version.workspace = true
edition.workspace = true
license = "MIT"
repository.workspace = true
description = "The web engine behind the Viewport shell, and the surface it renders into"

[features]
default = []
# Servo is an enormous build — SpiderMonkey included. Keeping it behind a
# feature means the protocol and compositor crates stay fast to compile and
# test on their own, and that everything else keeps working while this is
# being brought up.
# WPE WebKit. Off by default so this crate still builds and tests on a
# machine without a browser engine — the dma-buf and protocol work does not
# need one.
wpe = []

[dependencies]
viewport-ipc.workspace = true
anyhow.workspace = true
tracing.workspace = true

# The buffer the shell is painted into. Servo has no DMA-BUF rendering
# context, so we allocate one ourselves and hand Servo a framebuffer over it.
gbm = { version = "0.18", default-features = false, features = ["drm-support"] }
drm-fourcc = "2.2"
khronos-egl = { version = "6", features = ["dynamic"] }
libloading = "0.8"
glow = "0.16"

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[dev-dependencies]
# Polling the exported fence fd, to prove it is a real sync_file.
libc = "0.2"
