# Its own workspace root, which is what `exclude` in the tree's root manifest
# leaves it as. Without this, cargo walks up, finds the root that excludes it,
# and refuses to build anything at all.
[workspace]

[package]
name = "viewport-shell-cef"
version = "0.3.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/codebam/viewport"
description = "The Viewport shell, rendered out of process by Chromium embedded through CEF"

[dependencies]
viewport-ipc = { path = "../viewport-ipc" }
viewport-shell-bridge = { path = "../viewport-shell-bridge" }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1"

# The engine, embedded rather than driven. `default-features = false` drops
# the crate's build-util and sandbox features: the first pulls in clap and
# cargo_metadata for a bundler this does not use, and the second wants a
# setuid helper that a nix store path cannot be.
#
# Pinned to the 151 line, because that is what nixpkgs' `cef-binary` is. The
# crate's pre-generated bindings carry `CEF_API_VERSION_LAST`, and it is that
# number, not the crate's, that `api_hash` declares to libcef at run time. A
# crate whose CEF is newer than the library's newest supported API version
# (`152` against a 151 library) has that version refused — "Request for
# unsupported CEF API version 15200" — after which every CEF call dies on
# version -1. 151.8.1 is the newest 151 and carries the explicit-API-version
# wrapper fix; its CEF 151.3.24 is satisfied by nixpkgs' 151.3.16, and both
# declare the same API version 15101.
cef = { version = "151.8", default-features = false }
