[package]
name = "viewport-vulkan"
version.workspace = true
edition.workspace = true
# MIT, not GPL-3.0 like the compositor crate.
#
# Not for upstreaming: Smithay's AI.md asks that AI-generated contributions be
# disclosed and advises against them outright, so this will not be going into
# Smithay whatever its licence.
#
# MIT because the reference implementation worth reading here is wlroots'
# Vulkan renderer, which is MIT, and because a renderer is the most reusable
# thing in this repository — another compositor could vendor it, or someone
# could rewrite it by hand for upstream. GPL would buy nothing in return:
# there is no GPL Vulkan renderer to adapt from.
license = "MIT"
repository.workspace = true
description = "A Vulkan renderer for Smithay-based Wayland compositors"
readme = "README.md"
keywords = ["wayland", "vulkan", "compositor", "smithay", "renderer"]
categories = ["graphics", "rendering", "gui"]

# Publishing is blocked on the Smithay dependency, which is a git revision of a
# fork — a crates.io package cannot depend on either. Both halves have to go:
# `set_allow_tearing` has to land upstream, and upstream has to cut a release
# with the dispatch2 API this is written against. The crate is otherwise
# self-contained: it depends on no other Viewport crate and exposes no Viewport
# type.
publish = false

[dependencies]
anyhow.workspace = true
tracing.workspace = true
thiserror.workspace = true
ash = "0.38"
libc = "0.2"

# The fork and the revision are in the workspace manifest, shared with
# `viewport`. Only the features are this crate's.
[dependencies.smithay]
workspace = true
# wayland_frontend is what ImportDmaWl and ImportMemWl need — they take a
# wl_buffer. It is behind a feature so the renderer stays usable without a
# Wayland display, which is also what lets the tests run headless.
features = ["backend_vulkan", "backend_drm", "backend_gbm"]

[features]
default = ["wayland"]
wayland = ["smithay/wayland_frontend"]
