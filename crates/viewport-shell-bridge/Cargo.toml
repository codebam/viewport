[package]
name = "viewport-shell-bridge"
version.workspace = true
edition.workspace = true
license = "MIT"
repository.workspace = true
description = "The control-socket half of a Viewport shell that runs in a process of its own"

[dependencies]
# The origin policy the frame guard checks URLs against — protocol, not
# engine: `js::shell_url_allowed` is the same file:/loopback rule every
# backend enforces.
viewport-ipc.workspace = true
anyhow.workspace = true
tracing.workspace = true
# The log subscriber every shell starts with (`startup::init_tracing`).
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
