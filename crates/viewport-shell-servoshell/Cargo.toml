[package]
name = "viewport-shell-servoshell"
version.workspace = true
edition.workspace = true
license = "MIT"
repository.workspace = true
description = "The Viewport shell, rendered out of process by servoshell"

[dependencies]
viewport-ipc.workspace = true
viewport-shell-bridge.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true

# No engine, and no engine *crate*: Servo is a cargo dependency rather than a
# package, so the only way to embed it is to compile it — which is what
# `viewport-shell-servo` is for, and what this crate exists to avoid. Here the
# engine is a browser on PATH, exactly as `chromium` is a browser on PATH.
#
# The bridge is a loopback HTTP server written against `std::net` rather than a
# framework. It answers two routes for one client, so hyper would be a
# dependency tree for a hundred lines of request parsing — and the parsing is
# in `http` below, with tests, where it can be read.
