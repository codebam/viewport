[workspace]
resolver = "2"
members = [
    "crates/viewport",
    "crates/viewport-ipc",
    "crates/viewport-shell-bridge",
    "crates/viewport-shell-chromium",
    "crates/viewport-shell-gtk",
    "crates/viewport-web",
]

# Not a member, deliberately.
#
# `cargo test --workspace` is what .githooks/pre-commit and CI run, and this
# crate does not build without `CEF_PATH` pointing at a CEF distribution — so a
# member would mean neither of them could run on a machine without one. It is
# built by its own package, with its own lock file, when the cef backend is
# being worked on. See docs/shell-backends.md.
exclude = ["crates/viewport-shell-cef"]

[workspace.package]
version = "0.1.3"
edition = "2021"
repository = "https://github.com/codebam/viewport-smithay"

# License is deliberately per-crate rather than inherited.
#
# `viewport` is GPL-3.0-or-later so that compositor internals can be adapted
# from the existing GPL implementations — niri and cosmic-comp both have the
# color-management-v1 and wlr-output-management work that Smithay lacks.
#
# `viewport-ipc` and `viewport-web` stay MIT. The protocol crate should be
# reusable by anyone writing an alternative shell, and the DMA-BUF
# RenderingContext in `viewport-web` is exactly the kind of thing Servo would
# take upstream — Servo is MPL-2.0, which cannot absorb GPL-3.0 code.

[workspace.dependencies]
viewport-ipc = { path = "crates/viewport-ipc" }
viewport-shell-bridge = { path = "crates/viewport-shell-bridge" }
viewport-web = { path = "crates/viewport-web" }

# The Vulkan renderer, which used to be `crates/viewport-vulkan` and is now its
# own repository.
#
# It left because it could: it depends on no other crate here and exposes no
# type of ours, which made it the one part of this compositor another compositor
# could take. It is MIT where `viewport` is GPL-3.0, for the same reason.
#
# The cost of the split is this pin. A renderer change is now two commits — one
# there, one bumping the revision here — and `cargo test --workspace` no longer
# runs its tests, which run in its own CI instead. See the `[patch]` at the
# bottom of this file for the other half of the arrangement.
viewport-vulkan = { git = "https://github.com/codebam/viewport-vulkan.git", rev = "01c755da201acb7d9b79457cac485e4f2b5c8bab" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Pinned to a revision rather than the 0.7.0 release: the release predates the
# dispatch2 rework, and the API this code is written against is the one in the
# tree — `delegate_dispatch2!`, `backend.bind()` returning a framebuffer, and
# `render_output` taking one. Bump deliberately, not automatically.
#
# Features stay per-crate — the renderer needs three, the compositor needs a
# dozen — and Cargo unions them.
[workspace.dependencies.smithay]
# A fork, for one patch: DrmCompositor::set_allow_tearing, without which
# tearing-control-v1 is a protocol the compositor can advertise and never
# honour — the async flip flag lives inside the atomic commit smithay
# builds, and nothing upstream reaches it.
git = "https://github.com/codebam/smithay.git"
rev = "a8f1c0054b47c95362374a9b808235ea64837cc0"
default-features = false

# The other half of moving the renderer out of this workspace.
#
# `viewport-vulkan` depends on upstream Smithay, which is right for it: nothing
# in a renderer wants `set_allow_tearing`, and a crate meant to be reusable
# should not make its users adopt somebody else's fork. But two crates in one
# binary cannot link two Smithays — the types would be distinct and nothing
# would convert between them — and Cargo unifies git dependencies by URL and
# revision, so the fork and upstream are two packages however close the trees.
#
# This redirects the renderer's copy onto the fork above, which is what makes
# the pair link. It has to be in the workspace root: `[patch]` is ignored in any
# manifest that is not the one being built.
#
# Both revisions still have to be bumped together. Upstream moving is fine —
# the renderer's pin is its own business — but this fork has to be rebased onto
# something the renderer still compiles against before its pin here changes.
[patch."https://github.com/Smithay/smithay"]
smithay = { git = "https://github.com/codebam/smithay.git", rev = "a8f1c0054b47c95362374a9b808235ea64837cc0" }

[profile.release]
debug = 1
