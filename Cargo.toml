[workspace]
resolver = "2"
members = [
    "crates/viewport",
    "crates/viewport-ipc",
    "crates/viewport-shell-bridge",
    "crates/viewport-shell-chromium",
    "crates/viewport-shell-gtk",
    "crates/viewport-shell-servoshell",
    "crates/viewport-web",
]

# Not members, deliberately.
#
# `cargo test --workspace` is what .githooks/pre-commit and CI run, and neither
# of these can be built by it:
#
# * `viewport-shell-cef` does not build without `CEF_PATH` pointing at a CEF
#   distribution, so a member would mean neither the hook nor CI could run on a
#   machine without one.
#
# * `viewport-shell-servo` depends on the `servo` crate, which is the engine's
#   source: building it builds Servo, once, for hours. Excluded, it is compiled
#   only when somebody asks for it by cd'ing into it — never by a compositor
#   rebuild, never by the hook, never by CI. `viewport-shell-servoshell` is the
#   same engine without that bill, and it *is* a member, because it links
#   nothing.
#
# Both carry their own lock file and their own `[workspace]` table for the same
# reason. See docs/shell-backends.md.
exclude = ["crates/viewport-shell-cef", "crates/viewport-shell-servo"]

[workspace.package]
version = "0.1.8"
edition = "2021"
repository = "https://github.com/codebam/viewport"

# License is deliberately per-crate rather than inherited.
#
# `viewport` is GPL-3.0-or-later so that compositor internals can be adapted
# from the existing GPL implementations — niri and cosmic-comp both have the
# color-management-v1 and wlr-output-management work that Smithay lacks.
#
# `viewport-ipc` and `viewport-web` stay MIT. The protocol crate should be
# reusable by anyone writing an alternative shell, and the DMA-BUF
# RenderingContext in `viewport-web` is exactly the kind of thing Servo would
# take upstream — Servo is MPL-2.0, which cannot absorb GPL-3.0 code.

[workspace.dependencies]
viewport-ipc = { path = "crates/viewport-ipc" }
viewport-shell-bridge = { path = "crates/viewport-shell-bridge" }
viewport-web = { path = "crates/viewport-web" }

# The Vulkan renderer, which used to be `crates/viewport-vulkan` and is now its
# own repository.
#
# It left because it could: it depends on no other crate here and exposes no
# type of ours, which made it the one part of this compositor another compositor
# could take. It is MIT where `viewport` is GPL-3.0, for the same reason.
#
# The cost of the split is this pin. A renderer change is now two commits — one
# there, one bumping the revision here — and `cargo test --workspace` no longer
# runs its tests, which run in its own CI instead. See the `[patch]` at the
# bottom of this file for the other half of the arrangement.
viewport-vulkan = { git = "https://github.com/codebam/viewport-vulkan.git", rev = "1e752e1b8c01b364d23d4506f5149b6bbcc08216" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Pinned to a revision rather than the 0.7.0 release: the release predates the
# dispatch2 rework, and the API this code is written against is the one in the
# tree — `delegate_dispatch2!`, `backend.bind()` returning a framebuffer, and
# `render_output` taking one. Bump deliberately, not automatically.
#
# Features stay per-crate — the renderer needs three, the compositor needs a
# dozen — and Cargo unions them.
[workspace.dependencies.smithay]
# A fork: codebam/smithay, branch explicit-sync-scanout, which is upstream
# master with four patches on top. Rebased onto master rather than left to
# drift, so the delta stays reviewable and the day one of these lands upstream
# it drops out of the rebase instead of having to be untangled.
#
# - drm: allow a frame to be flipped in asynchronously. The one without which
#   tearing-control-v1 is a protocol this compositor can advertise and never
#   honour — the async flip flag lives inside the atomic commit smithay builds,
#   and nothing upstream reaches it.
# - virtual_keyboard, twice: let the compositor see the keys, and hand over the
#   symbol on the key as well. Upstream swallows both.
# - drm/renderer: carry a client's acquire point instead of assuming it waited.
#
# It was five. The drm_lease patch — treat EACCES from DROP_MASTER like EINVAL,
# without which the lease global was never created on 7.1 with amdgpu — is gone
# because upstream's 7609ab82 accepts `PermissionDenied` in the same match, and
# that is the kind Rust gives EACCES. It dropped out of the rebase, which is the
# arrangement above working rather than a patch being lost.
#
# The previous tip is tagged pre-rebase-09de0d99 over there, because a revision
# no ref reaches is one GitHub may collect, and older checkouts of this
# compositor pin it. (pre-rebase-b6e5bf02 and pre-rebase-a8f1c00 are the two
# before that.)
git = "https://github.com/codebam/smithay.git"
rev = "41cbec825c1f9d44f764b467a75e30f554132e63"
default-features = false

# The other half of moving the renderer out of this workspace.
#
# `viewport-vulkan` depends on upstream Smithay, which is right for it: nothing
# in a renderer wants `set_allow_tearing`, and a crate meant to be reusable
# should not make its users adopt somebody else's fork. But two crates in one
# binary cannot link two Smithays — the types would be distinct and nothing
# would convert between them — and Cargo unifies git dependencies by URL and
# revision, so the fork and upstream are two packages however close the trees.
#
# This redirects the renderer's copy onto the fork above, which is what makes
# the pair link. It has to be in the workspace root: `[patch]` is ignored in any
# manifest that is not the one being built.
#
# The two revisions still have to be bumped together, and this one has to match
# the entry above exactly — a patch pointing somewhere else would put the second
# Smithay back rather than remove it.
#
# They currently agree by construction: the fork is upstream master rebased, and
# the renderer pins the master commit it was rebased onto. Keeping it that way
# is what makes this a redirect and not a downgrade — rebase the fork before
# bumping either pin, not after.
[patch."https://github.com/Smithay/smithay"]
smithay = { git = "https://github.com/codebam/smithay.git", rev = "41cbec825c1f9d44f764b467a75e30f554132e63" }

[profile.release]
debug = 1
