<!--
  A session bus for integration tests, deliberately without service directories.
  The system session.conf includes xdg-desktop-portal activation; after the fake
  frontend in screencast-restore exits, that real frontend can take its name on
  the next test pass and turn an isolated test into a race with the host.
-->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <type>session</type>
  <listen>unix:tmpdir=/tmp</listen>
  <auth>EXTERNAL</auth>
  <!-- No standard_session_servicedirs: nothing can be auto-activated. -->
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
