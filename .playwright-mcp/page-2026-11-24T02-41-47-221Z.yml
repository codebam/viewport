            - heading "Runtime Design" [level=3] [ref=f5e85]
            - paragraph [ref=f5e86]: "Muse Code uses a local event log in which every model call, tool run, approval, and edit is appended. This single source of truth makes the runtime replay-exact and restart-safe: after a crash, the agent can resume precisely where it stopped. That ability lets Muse Code take on long-running tasks without being derailed by failures."
            - heading "Bundled Skills" [level=3] [ref=f5e87]
            - paragraph [ref=f5e88]:
              - text: Muse Code ships with several default skills.
              - code [ref=f5e89]: /plan
              - text: turns a task into an approval-gated plan,
              - code [ref=f5e90]: /grill
              - text: stress-tests that plan until it holds up, and
              - code [ref=f5e91]: /goal
              - text: works toward successful completion of the specified objective.
