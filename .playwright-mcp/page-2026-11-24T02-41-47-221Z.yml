              - paragraph [ref=f5e131]: The user inputs a fly-through video of a home into the terminal as an mp4 file. Muse Code interprets the video and produces a visually rich vacation home marketing and booking page.
            - heading "Muse Spark 1.2" [level=2] [ref=f5e132]
            - paragraph [ref=f5e133]: Muse Spark 1.2 is a coding-focused update to Muse Spark 1.1, with improvements in code generation, complex debugging, codebase understanding, and end-to-end developer workflows. In Muse Spark 1.2, we significantly scaled up training compute on coding tasks while expanding training environment diversity. The model also maintains its strength in other key areas like general agents.
            - figure [ref=f5e134]:
              - tablist "Muse Spark 1.2 evaluations" [ref=f5e136]:
                - tab "Coding" [selected] [ref=f5e137] [cursor=pointer]
                - tab "General Agents" [ref=f5e138] [cursor=pointer]
              - tabpanel "Coding" [ref=f5e140]:
                - group "Coding" [ref=f5e141]:
                  - figure [ref=f5e142]:
                    - img "Bar chart comparing Terminal-Bench 2.1 scores for Muse Spark 1.2 and other coding models." [ref=f5e146]
                  - figure [ref=f5e147]:
                    - img "Bar chart comparing DeepSWE 1.1 scores for Muse Spark 1.2 and other coding models." [ref=f5e151]
                  - figure [ref=f5e152]:
                    - img "Bar chart comparing Meta Internal Coding Bench scores for Muse Spark 1.2 and other coding models." [ref=f5e156]
            - paragraph [ref=f5e157]:
              - text: For more details about our evaluations, see
              - link "our report" [ref=f5e158] [cursor=pointer]:
                - /url: /static/muse-spark-1-2-methodology
              - text: .
            - heading "Co-Training With Muse Code" [level=3] [ref=f5e159]
            - paragraph [ref=f5e160]: We co-trained Muse Spark 1.2 with Muse Code to ensure the model exhibits its best performance and coding usability when paired together. The training included rejection sampled harness trajectories and recipe optimizations for goals, compaction, and subagents, alongside the integration of the Muse Code toolset to maximize harness compatibility.
            - heading "Long-Horizon" [level=3] [ref=f5e161]
            - paragraph [ref=f5e162]: Muse Spark 1.2 was extensively trained on long-horizon coding tasks, including whole-repository generation, large end-to-end projects, and auto-research. It leverages planning to sequence work, goal conditioning to maintain direction, and context compaction to retain the knowledge needed to sustain progress.
            - heading "Self-Improvement" [level=3] [ref=f5e163]
            - paragraph [ref=f5e164]: We also used Muse Spark 1.1 to generate challenging coding environments and instruction-following templates. The model then graded candidate solutions on how well they satisfied those requirements, producing a scalable training dataset for Muse Spark 1.2. This self-improvement loop helped Muse Spark 1.2 follow complex instructions more precisely than its predecessor.
            - 'heading "Case Study: Kernel Optimization" [level=2] [ref=f5e165]'
            - paragraph [ref=f5e166]: We tested the model's ability to iteratively optimize GPU kernels over 1,000+ tool calls (up to 24 hours). Leveraging Muse Code's agentic coding environment, the model writes, compiles, profiles, and progressively improves kernel performance relative to a provided baseline implementation. We benchmarked on KDA and MLA kernels for NVIDIA Hopper GPUs. The agent continues to achieve substantial improvements over the provided baseline implementation.
            - figure [ref=f5e167]:
              - tablist "Kernel optimization charts" [ref=f5e169]:
                - tab "KDA" [selected] [ref=f5e170] [cursor=pointer]
                - tab "MLA" [ref=f5e171] [cursor=pointer]
              - tabpanel "KDA" [ref=f5e173]:
                - group "KDA" [ref=f5e174]:
                  - figure [ref=f5e175]:
                    - img "Chart comparing KDA kernel speedup against the baseline over cumulative tool calls for Muse Spark 1.2 and other models." [ref=f5e179]
                - paragraph [ref=f5e180]: The baseline is the FLA Triton implementation of KDA. Models were prohibited from importing third-party kernel libraries such as FLA directly; instead, they had to apply specialized kernel-optimization knowledge to implement the algorithm in Triton, rather than wrap existing implementations. Muse Spark 1.2 paired a chunk-parallel preparation kernel with a sequential inter-chunk scan, combining standard fusion and tiling with KDA-specific optimizations such as re-centering the gated cumulative decay at the chunk midpoint.
            - heading "Availability" [level=2] [ref=f5e181]
            - paragraph [ref=f5e182]: Muse Spark 1.2 is available today in Muse Code and in Meta Model API with expanded global access. We have a lot on the horizon, including new harness features and more powerful models. We can’t wait to see what you build!
            - link "Get started with Muse Code on the Meta developer site" [ref=f5e183] [cursor=pointer]:
              - /url: https://dev.meta.ai
              - text: Get started with Muse Code
