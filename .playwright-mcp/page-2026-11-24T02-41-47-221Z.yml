          - generic [ref=f5e50]:
            - paragraph [ref=f5e51]: We're excited to release Muse Code (beta), a terminal coding agent powered by Muse Spark 1.2, our newest model. This marks our next step toward the frontier, with larger and much more capable models on the way.
            - region [ref=f5e52]:
              - heading "Install Muse Code on macOS or Linux:" [level=2] [ref=f5e53]
              - generic [ref=f5e54]:
                - code [ref=f5e56]: curl -fsSL https://dev.meta.ai/install.sh | bash
                - button "Copy installation command" [ref=f5e57] [cursor=pointer]
            - paragraph [ref=f5e65]: "Muse Code takes on complex software engineering tasks across large repositories: planning changes, writing code, and validating the results. It can coordinate multiple persistent subagents for each task, solving difficult problems faster, more accurately, and with less intervention."
            - heading "Muse Code" [level=2] [ref=f5e66]
            - heading "Async Background Agents" [level=3] [ref=f5e67]
            - paragraph [ref=f5e68]: Muse Code operates with a simple agent loop plus a set of async background agents to enhance the main agent's capability. These specialized background agents remain active throughout each session, rather than being spawned for individual tasks, helping avoid redundant information gathering. They carry out next steps and choose when to communicate back to the main agent. Their persistence reduces latency and the need for steering on difficult, multi-step tasks.
