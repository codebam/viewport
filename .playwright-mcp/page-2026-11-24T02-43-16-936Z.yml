                      - heading "Tencent's Hy3 Bets On AI Agents Over Model Size" [level=1] [ref=f26e716]
                      - generic [ref=f26e717]:
                        - generic [ref=f26e718]:
                          - generic [ref=f26e720]:
                            - link [aria-hidden] [ref=f26e723] [cursor=pointer]:
                              - /url: https://profiles.yahoo.com/brands/forbes/
                            - generic [ref=f26e725]:
                              - generic [ref=f26e726]:
                                - link "Forbes" [ref=f26e727] [cursor=pointer]:
                                  - /url: https://profiles.yahoo.com/brands/forbes/
                                - generic [ref=f26e728]:
                                  - text: ·
                                  - button "Follow" [disabled] [ref=f26e730]
                              - generic [ref=f26e732]: Vivian Toh, Contributor
                          - generic [ref=f26e733]:
                            - link "Add to Preferred Sources on Google, opens in a new tab" [ref=f26e736] [cursor=pointer]:
                              - /url: https://www.google.com/preferences/source?q=tech.yahoo.com
                              - text: Add to Preferred Sources
                            - link "View comments" [ref=f26e737] [cursor=pointer]:
                              - /url: "#article-comments-8364c079-7f2e-3f4a-b8ef-368fd9cc1b1a"
                            - button "Share this article" [ref=f26e742] [cursor=pointer]
                        - generic [ref=f26e747]:
                          - text: Updated
                          - time [ref=f26e748]: Mon, July 13, 2026 at 8:05 AM UTC
                  - generic [ref=f26e749]:
                    - generic [ref=f26e751]:
                      - figure [ref=f26e754]:
                        - generic [ref=f26e755]:
                          - img "hy3 released on 6 July" [ref=f26e756]
                          - button "View larger image" [ref=f26e757] [cursor=pointer]
                        - generic [ref=f26e763]:
                          - paragraph [ref=f26e764]: Hy3 released on 6 July
                          - text: Hy website
                      - generic [ref=f26e765]:
                        - paragraph [ref=f26e766]:
                          - text: When Meta CEO
                          - link "Mark Zuckerberg recently suggested" [ref=f26e767] [cursor=pointer]:
                            - /url: https://www.bloomberg.com/news/articles/2026-07-09/meta-s-zuckerberg-says-exploring-ai-cloud-business-makes-sense
                          - text: "AI companies face difficult tradeoffs between scaling computing infrastructure and expanding research talent, Silicon Valley's default assumption remained unchanged: the race is still about who builds the biggest model."
                        - paragraph [ref=f26e768]: Tencent's latest release suggests China's largest technology companies may be running a different calculation entirely.
                        - paragraph [ref=f26e769]:
                          - text: Last week, Tencent officially launched
                          - link "Hy3" [ref=f26e770] [cursor=pointer]:
                            - /url: https://hy.tencent.com/research/hy3
                          - text: ", the third generation of its flagship large language model. The specifications are competitive: a Mixture-of-Experts architecture with 295 billion total parameters, 21 billion activated parameters, and a 256K context window. What stands out is not the scale, but the positioning. Tencent is marketing Hy3 as a model optimized for real-world AI agents—coding assistants and enterprise productivity workflows—rather than benchmark supremacy."
                        - paragraph [ref=f26e771]: That distinction reflects a broader shift across China's AI sector. As hardware constraints continue to shape domestic development, Chinese companies are increasingly prioritizing deployment efficiency and commercialization over raw model size. The question is whether this product-first strategy can close the capability gap with Western frontier models.
                        - 'heading "Benchmark Reality: Strong on Agents" [level=2] [ref=f26e772]'
                        - paragraph [ref=f26e773]:
                          - text: Independent evaluations reveal a mixed picture. On agentic search and tool orchestration, Hy3 performs strongly—scoring 84.2 on BrowseComp and 79.1 on the public MCP-Atlas set, competitive with proprietary models like Claude Opus 4.8 and GPT-5.5, according to independent AI consultancy
                          - link "Flowtivity" [ref=f26e774] [cursor=pointer]:
                            - /url: https://www.flowtivity.ai/benchmarks/hy3
                          - text: . Its hallucination rate of 5.4% is notably lower than Grok 4.5's 54% and competitive with frontier proprietary models.
                        - paragraph [ref=f26e775]: "But the coding story is different. On SWE-bench Verified, Hy3 scores 78%—solid, but trailing GLM-5.2 (84.2%), Claude Opus 4.8, and GPT-5.5. The gap widens on more demanding coding benchmarks: Terminal-Bench 2.1 (71.7 vs. GLM-5.2's 81) and DeepSWE (28.0 vs. GLM-5.2's 46.2)."
                        - paragraph [ref=f26e776]:
                          - text: This makes sense architecturally. GLM-5.2 is a 744-billion-parameter MoE with roughly 40 billion active parameters—nearly double Hy3's activated compute per token. As one
                          - link "independent analysis" [ref=f26e777] [cursor=pointer]:
                            - /url: https://www.innfactory.de/blog/hy3-analysis
                          - text: notes, "For the model size—only 21B active parameters—the results are remarkable".
                        - heading "The Co-Design Gamble" [level=2] [ref=f26e778]
                        - paragraph [ref=f26e779]: Tencent describes Hy3's development philosophy as "Co-Design"—an iterative process in which models and AI-native applications evolve together. Products including WorkBuddy, Yuanbao, ima, Marvis, and CodeBuddy function as live testing environments, with every workflow generating feedback to refine model capabilities.
                        - paragraph [ref=f26e780]:
                          - text: The company reports that WorkBuddy's internal task success rate
                          - link "increased from 72% to 90%" [ref=f26e781] [cursor=pointer]:
                            - /url: https://www.news.cn/tech/20260706/d611426ecba54475b2dd94920e4e3557/c.html
                          - text: ", while average execution time fell by 34%. Yuanbao's hallucination rates in long-document and AI search scenarios dropped by more than half."
                        - paragraph [ref=f26e782]:
                          - text: "What can be verified is the model's pricing: at approximately"
                          - link "$0.18 per million input tokens and $0.59 per million output tokens via Tencent Cloud" [ref=f26e783] [cursor=pointer]:
                            - /url: https://cloud.tencent.com/pricing/hy3
                          - text: . An FP8-quantized variant fits on a single 8x H200 node—under 300GB—making self-hosting viable for enterprises concerned about data sovereignty.
                        - heading "The MoE Efficiency Play" [level=2] [ref=f26e784]
                        - paragraph [ref=f26e785]:
                          - text: Hy3's architecture choice is telling. As a Mixture-of-Experts model, it activates only a subset of parameters per token, offering 3-8x higher throughput per GPU at scale compared to dense models, according to
                          - link "infrastructure analysis" [ref=f26e786] [cursor=pointer]:
                            - /url: https://www.callmissed.com/moe-enterprise-ai
                          - text: . This efficiency is critical in a market where access to advanced AI chips remains constrained.
                        - paragraph [ref=f26e787]: But MoE architectures carry tradeoffs. Industry analysis points to "expert underutilization" as a persistent challenge, along with load balancing complexity that can make debugging difficult. At low utilization—typical for bursty enterprise workloads—dense models often prove more cost-effective and predictable.
                        - paragraph [ref=f26e788]: Tencent's bet is that its massive software ecosystem will solve the utilization problem. WorkBuddy generates automation requests. Yuanbao captures conversational data. WeChat, gaming services, and productivity applications expose diverse interaction patterns. The company claims daily token consumption of Hy3 has increased twenty-fold since preview release, while users actively selecting Hy3 inside WorkBuddy grew six times.
                        - paragraph [ref=f26e789]: "This creates a feedback loop: more users generate more complex workflows, which improve the model, which makes the agents more useful."
                        - 'heading "The Global Context: Not Just China Asking Different Questions" [level=2] [ref=f26e790]'
                        - paragraph [ref=f26e791]:
                          - text: Tencent's strategy is not unique to China. In Silicon Valley, Anthropic has quietly overtaken OpenAI in enterprise API market share—
                          - link "roughly 32% versus 25%" [ref=f26e792] [cursor=pointer]:
                            - /url: https://www.valueaddvc.com/anthropic-openai-enterprise
                          - text: in 2026—by focusing on coding reliability and long-context reasoning rather than model scale. Claude Code, Anthropic's terminal-native coding agent, has become a major growth driver, reportedly hitting $2.5 billion in annualized revenue.
                        - paragraph [ref=f26e793]: The parallel is instructive. Both Tencent and Anthropic are betting that enterprise customers care more about workflow completion, reliability, and latency than marginal gains on academic benchmarks. Both are pursuing efficiency over scale.
                        - heading "What This Means for Enterprise Software" [level=2] [ref=f26e794]
                        - paragraph [ref=f26e795]: Hy3's release underscores a structural transformation in how AI is deployed. Office suites are evolving from document organizers into execution engines. WorkBuddy already supports automated script generation and workflow orchestration. As these products mature, the software shapes the intelligence behind it—not merely hosting AI, but actively training it.
                        - paragraph [ref=f26e796]: This dynamic may become Tencent's strongest defensive moat. Unlike standalone model providers, Tencent can validate improvements against millions of real business tasks across its ecosystem before external developers ever access them.
                        - heading "The Bottom Line" [level=2] [ref=f26e797]
                        - paragraph [ref=f26e798]: Hy3 is more than a model upgrade. It is a test of whether China's product-integrated AI strategy can compensate for hardware constraints and benchmark gaps.
                        - paragraph [ref=f26e799]: The early results are promising on agentic tasks and reliability. Tencent's ecosystem gives it a data flywheel that standalone providers cannot easily replicate. Whether that flywheel can close the capability gap—rather than merely making an efficient model more efficient—will determine whether Hy3 is a competitive alternative or simply a well-integrated domestic solution.
                        - paragraph [ref=f26e800]:
                          - emphasis [ref=f26e801]: This article was originally published on
                          - link [ref=f26e802] [cursor=pointer]:
                            - /url: https://www.forbes.com/sites/viviantoh/2026/07/13/tencents-hy3-bets-on-ai-agents-over-model-size/
                            - emphasis [ref=f26e803]: Forbes.com
