            - link "Sign up and start building on the Meta developer site" [ref=f2e171] [cursor=pointer]:
              - /url: https://dev.meta.ai
              - text: Sign up and start building
            - heading "Safety" [level=2] [ref=f2e172]
            - paragraph [ref=f2e173]: We’ve improved safety along several axes most relevant to agentic and coding capabilities. Muse Spark 1.3 shows stronger adversarial robustness, with improved resistance to adversarial inputs and prompt injections. On complex agentic tasks, the model has better calibration on what constitutes irreversible actions and proceeds accordingly. Together, these changes reflect better discretion and judgment in long-horizon agentic tasks.
            - heading "Looking Forward" [level=2] [ref=f2e174]
            - paragraph [ref=f2e175]: We have an exciting roadmap lined up, including bigger models, the Muse Spark open weights release, and more. Stay tuned.
