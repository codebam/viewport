            - heading "Introducing Muse Spark 1.3" [level=1] [ref=f2e34]
            - generic [ref=f2e35]:
              - time [ref=f2e36]: September 2, 2026
              - generic [ref=f2e37]:
                - generic [aria-hidden] [ref=f2e38]: ·
                - generic [ref=f2e39]: 3 minute read
          - figure [ref=f2e44]:
            - img "Layered blue paths and arrows curve across an abstract field." [ref=f2e48]
          - generic [ref=f2e50]:
            - paragraph [ref=f2e51]: We’re excited to release Muse Spark 1.3, which delivers improved performance across agentic and coding tasks. Drawing on what we learned from months of broad adoption of Muse Code and Meta Model API, we’ve also made this model easier to use in real-world settings. Smarter and more practically useful, Muse Spark 1.3 advances our work toward personal superintelligence.
            - paragraph [ref=f2e52]:
              - text: Muse Spark 1.3 with max reasoning is now available on Muse Code and Meta Model API. Get started at
              - link "dev.meta.ai" [ref=f2e53] [cursor=pointer]:
                - /url: https://dev.meta.ai/
              - text: .
            - figure [ref=f2e54]:
              - img "Benchmark scorecard comparing Muse Spark 1.3, Muse Spark 1.2, GPT 5.6 Sol (max), and Opus 5 (max) across agent, coding, instruction-following, and long-context evaluations." [ref=f2e59]
            - paragraph [ref=f2e60]:
              - text: For more details about our evaluations, see
              - link "our report" [ref=f2e61] [cursor=pointer]:
                - /url: /static/muse-spark-1-3-multimodal-evaluation-methodology
              - text: .
            - heading "Agentic Workflows" [level=2] [ref=f2e62]
            - paragraph [ref=f2e63]: Muse Spark 1.3 is designed to better sustain longer-horizon work by collaborating with users and juggling multiple workflows in a single, long thread. When given an open-ended objective, it uses tools to generate its own context across messy and conflicting sources, proactively corrects gaps in its plan, and keeps track of what it has learned to produce a final deliverable. We trained the model across a diverse set of harnesses to generalize to various agentic environments.
            - figure [ref=f2e64]:
              - generic [ref=f2e66]:
                - generic "Google Docs and a terminal shown side by side as Muse Spark 1.3 completes a holiday campaign task." [ref=f2e67]
                - generic:
                  - button "Play Google Docs and a terminal shown side by side as Muse Spark 1.3 completes a holiday campaign task." [ref=f2e70] [cursor=pointer]
                  - generic [ref=f2e74]:
                    - button "Show captions for Google Docs and a terminal shown side by side as Muse Spark 1.3 completes a holiday campaign task." [ref=f2e76] [cursor=pointer]
                    - button "Mute Google Docs and a terminal shown side by side as Muse Spark 1.3 completes a holiday campaign task." [ref=f2e82] [cursor=pointer]
                  - generic [ref=f2e88]:
                    - generic [ref=f2e89]:
                      - generic [ref=f2e90]: Google Docs and a terminal shown side by side as Muse Spark 1.3 completes a holiday campaign task. playback position
                      - generic [ref=f2e91]: 0:00 of 0:00
                      - generic [aria-hidden] [ref=f2e92]: 00:00 / 00:00
                      - slider "Google Docs and a terminal shown side by side as Muse Spark 1.3 completes a holiday campaign task. playback position" [disabled] [ref=f2e93]: "0"
                    - button "Enter full screen for Google Docs and a terminal shown side by side as Muse Spark 1.3 completes a holiday campaign task." [ref=f2e95] [cursor=pointer]
            - paragraph [ref=f2e102]: Trained to more actively collaborate with the user, Muse Spark 1.3 asks clarifying questions when prompts are ambiguous, invokes help from the user when stuck, and confirms before taking consequential actions. When working on long tasks, it adapts to user preferences, either providing frequent updates or working silently in the background.
            - paragraph [ref=f2e103]: Muse Spark 1.3 follows complex, long-form instructions more reliably than earlier Muse Spark models. Across multi-step tasks, it’s better at preserving detailed requirements without dropping constraints or drifting from the requested workflow.
            - region "First Freeze" [ref=f2e104]:
              - generic [ref=f2e106]:
                - 'tooltip "Note: this AI agent prototype was created by Muse Spark and is not a real product" [ref=f2e107]'
                - button "About this demo" [ref=f2e108] [cursor=pointer]:
                  - generic [aria-hidden] [ref=f2e110]: i
            - paragraph [ref=f2e111]: We’ve also improved the multitasking capabilities of Muse Spark 1.3. For example, it now more accurately maps incoming prompts to the correct task within messy, single-threaded contexts, regardless of whether the user is steering past requests or interrupting them.
            - paragraph [ref=f2e112]: The model has better awareness of its own capabilities and limitations. We trained Muse Spark 1.3 to have a better sense of what it can and can’t do, what it knows and doesn’t know, and when it hits hurdles instead of hallucinating outcomes.
            - region "GDPVal examples" [ref=f2e113]:
              - tablist "GDPVal examples" [ref=f2e116]:
                - tab "X-wing" [selected] [ref=f2e117] [cursor=pointer]
