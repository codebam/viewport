    - article [ref=f13e25]:
      - paragraph [ref=f13e26]: 2026年9月20日
      - heading "阶跃发布旗舰模型 Step 5 Preview：向前一步，智能效率的新一代“帕累托前沿”" [level=1] [ref=f13e27]
      - generic [ref=f13e28]:
        - paragraph [ref=f13e29]: 帕累托前沿，描述的是多个目标之间所能达到的最佳平衡：在这条边界上，想进一步改善一个维度，通常就必须牺牲另一个。对 AI 模型而言，能力、效率与成本之间也存在这样的取舍。推进帕累托前沿，并不是让取舍消失，而是通过新的模型设计，将这条边界继续向外推——
        - paragraph [ref=f13e30]:
          - strong [ref=f13e31]: 阶跃新一代旗舰模型 Step 5 Preview，为此而来！
        - paragraph [ref=f13e33]:
          - text: 这是一款面向真实世界 Agentic 任务的旗舰基座模型。我们认为，随着 Agent 从“回答问题”走向“完成任务”，日常工作主力模型的标准也在发生变化：
          - strong [ref=f13e34]: 不再只是单项能力足够强，而是要在能力、成本、效率和场景覆盖之间实现更好平衡
          - text: 。Step 5 Preview 正是围绕这种平衡而设计。
        - paragraph [ref=f13e35]:
          - text: 它采用稀疏 MoE 架构，总参数量
          - strong [ref=f13e36]: 600B
          - text: 、激活参数仅
          - strong [ref=f13e37]: 27B
          - text: ，支持
          - strong [ref=f13e38]: 100 万 Token
          - text: 上下文窗口，原生支持文本与视觉输入，在 AI 编程、软件工程、专业知识工作、金融等场景表现突出。
        - paragraph [ref=f13e39]:
          - text: 在全球权威的 Artificial Analysis Intelligence Index 中，Step 5 Preview 取得
          - strong [ref=f13e40]: "44"
          - text: 分，
          - strong [ref=f13e41]: 位居全球开源模型前三
          - text: 。与此同时，Step 5 Preview 单任务成本仅为 Claude Opus 5 的 1/8。这意味着，Step 5 Preview 在同样成本下获得更强智能，也让同等能力能以更低成本投入实际工作——进一步推动 AI 模型的帕累托前沿。
        - paragraph [ref=f13e42]: 在公开和内部评估中，Step 5 Preview 在复杂的软件工程任务（包括长程规划任务）、专业知识工作和金融领域等基准测试中展现出较为均衡的综合能力，并在 Agents' Last Exam 的 CLI 子集 ALE-CLI、金融投资研究评测 FrontierFinance，以及跨领域深度研究评测 DRACO 上仅次于 GPT-6 Astra 或 Claude Opus 5，领先其他参评开源模型。
        - blockquote [ref=f13e43]:
          - paragraph [ref=f13e44]: GDPval-AA v2 采用 Artificial Analysis 截至 2026 年 9 月 19 日公布的最新结果。DeepSWE v1.1 使用SWE-agentharness 进行评测，参数设置为 temperature=1.0 和 top_p=0.95。
        - paragraph [ref=f13e45]:
          - strong [ref=f13e46]: 今天起，Step 5 Preview 全量开放
          - text: ，我们由衷希望它能成为你在 Agent 任务中的日常主力模型。此外，Step 5 Preview 依旧是一款
          - strong [ref=f13e47]: 开源模型
          - text: ，我们将在10 月 15 日释放模型权重，欢迎大家持续关注。
