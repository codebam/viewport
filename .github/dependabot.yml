version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly

  # The two crates the root manifest excludes; each has its own Cargo.lock, so
  # Dependabot has to be pointed at each directory to see them at all.
  - package-ecosystem: cargo
    directory: /crates/viewport-shell-cef
    schedule:
      interval: weekly

  - package-ecosystem: cargo
    directory: /crates/viewport-shell-servo
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
