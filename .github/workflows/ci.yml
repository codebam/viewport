# Four jobs, three of which run on every push and need nothing a hosted runner
# has not got.
#
# `shell` is the layout engine: plain JavaScript, node and nothing else.
# `rust` is the compositor — fmt, clippy, the unit tests, the Wayland
# integration tests, and a build with the web engine turned on. `asan` is the
# same suite instrumented.
#
# That the last two run unassisted is recent and was not free. The headless
# backend renders through a surfaceless EGL display, so the integration tests
# want no GPU and no DRM render node; and WPE WebKit, which used to mean a
# four-hour build on a runner with 14 GB of disk against a 20-40 GB build tree,
# substitutes from the project's own binary cache in about a minute. Every job
# below is configured to reach that cache, and `rust` refuses to start rather
# than build the engine if it ever stops being there.
#
# The wlroots compositor these jobs used to test is gone; the tests that drove
# it now drive the Rust binary instead. What was learned in the process is
# worth keeping: those jobs could never have passed on a hosted runner, because
# wlroots wants a DRM fd rather than merely a Vulkan device, and no lavapipe
# ICD supplies one. They sat behind a repository variable from the day they
# were written, so nobody found out.
#
# The wpewebkit-cache job builds the engine on demand and pushes it to Cachix.
# It is never triggered by a push.
name: CI

# Nothing here runs by itself any more. `.githooks/pre-commit` does the same
# checks before a commit is made, which is where they were being run anyway.
#
# What made this worth turning off rather than fixing: the `rust` job refuses
# to run when WPE WebKit is not substitutable, which is right — building the
# engine on a hosted runner is hours and more disk than it has — and nothing
# was keeping it substitutable. The compositor jobs read the project's cache
# at codebam-nix-cache.storage.googleapis.com; `wpewebkit-cache`, the job whose
# whole purpose is to keep the engine there, pushes to *Cachix* and is gated on
# `vars.CACHIX_CACHE`, which is not set on this repository. So it has never
# run, and the bucket has never held the engine. Every green run until now was
# substituting from the GitHub Actions cache by way of magic-nix-cache, which
# GitHub evicts after a week idle or when a repository passes 10GB — and a
# WebKit closure is exactly what gets evicted. It expired, and every push since
# has failed on a cache that was never the one being read.
#
# To put it back: restore `push:` and `pull_request:` below, and either point
# `wpewebkit-cache` at the bucket the other jobs substitute from, or populate
# that bucket by hand and leave the job deleted.
on:
  # Still runnable from the Actions tab, and by the cache job's own guard.
  workflow_dispatch:

# A push to a branch with an open pull request fires both events, and there is
# no reason to run the same commit twice.
#
# Keyed on head_ref, not ref: for a pull_request event github.ref is the merge
# ref, refs/pull/<n>/merge, while the push that triggered it carries
# refs/heads/<branch>. Keying on github.ref alone puts the two in different
# groups, so neither cancels the other. github.head_ref is set only on
# pull_request, which is exactly when the substitution is needed.
#
# Scheduled and dispatched runs get a group of their own. They carry
# github.ref of the default branch, so without the suffix any push to main
# would cancel-in-progress a WebKit build that has been running for hours and
# is minutes from populating the cache.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.head_ref || github.ref }}-${{
    (github.event_name == 'schedule' ||
    github.event_name == 'workflow_dispatch') && github.event_name || 'ci' }}
  cancel-in-progress: true

jobs:
  # The tiling tree, the scrolling layout, and the restore-a-saved-session
  # path. Nothing here touches Wayland or the compositor binary — the tests
  # stub the DOM and run the real data/shell scripts, so a broken layout tree
  # is caught here rather than by looking at screenshots.
  #
  shell:
    name: Shell logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Run the four combinations meson would, but directly. meson makes these
      # optional so a checkout without node still gets the compositor tests;
      # here that rule is backwards, and naming each one means a missing
      # variant fails loudly instead of quietly not running.
      - name: Layout tests
        run: |
          set -eux
          node tests/shell.test.js data/shell tiling
          node tests/shell.test.js data/shell scrolling
          node tests/shell.test.js data/shell tiling session
          node tests/shell.test.js data/shell scrolling session
          node tests/kiosk.test.js examples/kiosk


  # The Rust rewrite: fmt, clippy and the whole test suite, on every push.
  #
  # This runs unassisted for the same reason the shell job does — it needs
  # nothing that a hosted runner cannot substitute in seconds. The web engine
  # is behind the `wpe` feature, off by default, and crates/viewport-web's
  # build.rs only probes pkg-config when it is on, so `cargo test --workspace`
  # links Smithay, DRM, libinput and libseat and no WebKit at all. `.#rust` is
  # the devshell that carries exactly that and nothing else; `.#default` would
  # drag in wlroots, WPE and a Servo recipe and put this job behind the same
  # cache gate as the compositor ones.
  #
  # -D warnings rather than a bare clippy run: the point is that a warning
  # fails the build. The three lints that are deliberate carry an #[allow] and
  # a comment saying why, which is the form an exception should take.
  rust:
    name: Rust rewrite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The project's own binary cache, on every job that evaluates this flake.
      #
      # flake.nix declares it in nixConfig, and that is not enough anywhere:
      # nixConfig applies to interactive evaluation and only with
      # accept-flake-config, so a runner reads none of it. Configuring the
      # installer is what makes it real.
      #
      # Read-only and unauthenticated — the bucket is public, so there is no
      # secret here and a fork gets the same substitutions. The public key
      # matters as much as the URL: without it nix reaches the bucket and
      # rejects every narinfo in it as unsigned, which fails silently and looks
      # exactly like a cache with nothing in it.
      - uses: DeterminateSystems/nix-installer-action@v4
        with:
          extra-conf: |
            extra-substituters = https://codebam-nix-cache.storage.googleapis.com
            extra-trusted-public-keys = codebam-nix-cache-1:ZiBhSEjcy3Y53eTmQIdJsa1T1T6fCrh52EK22amzkD0=
      - uses: DeterminateSystems/magic-nix-cache-action@v2

      # One `nix develop` for all three, so the shell is realised once. Split
      # into separate steps and each would pay for it again.
      #
      # Ordered cheapest-first: a formatting diff is a one-line fix and there
      # is no reason to spend a compile finding it. `set -euo pipefail` because
      # a bare multi-line run: stops at the last command's status, which would
      # let a clippy failure through whenever the tests passed.
      - name: Format, lint and test
        run: |
          nix develop .#rust --command bash -euo pipefail -c '
            cargo fmt --all --check
            cargo clippy --workspace --all-targets -- -D warnings
            cargo test --workspace
          '

      # The Wayland integration tests — capture, session lock, output order —
      # against the binary just built. These are what "parity" means in
      # docs/RUST-REWRITE.md, and until now the only thing that ran them
      # against this compositor was a person remembering to.
      #
      # Unassisted for two reasons that both had to become true. The clients
      # they drive link wayland-client and the generated marshalling code and
      # nothing else, so scripts/integration.sh compiles them directly rather
      # than through meson, which would want wlroots at setup time. And the
      # compositor no longer needs a device node: its headless backend renders
      # through a surfaceless EGL display, which on a runner with no /dev/dri
      # is Mesa's software rasteriser.
      #
      # The default-features binary, deliberately — no `wpe`, so no WebKit.
      # The shell is not under test here; a headless compositor without one
      # falls back to a built-in layout after 2500ms, which is what these
      # clients are placed by.
      - name: Wayland integration tests
        env:
          # No GPU on a hosted runner, so this is where it lands anyway.
          # Named rather than left to chance: a machine that does have one
          # would otherwise test a different driver than CI does.
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          nix develop .#rust --command bash -euo pipefail -c '
            cargo build --bin viewport
            scripts/integration.sh target/debug/viewport
          '

      # The `wpe` half, which none of the above compiles: `cargo` here builds
      # the default features, leaving everything inside
      # `#[cfg(feature = "wpe")]` untouched — the shell, the DMA-BUF import,
      # the WPE shim, which is to say the reason the compositor exists.
      #
      # This used to live in the compositor job because turning the feature on
      # pulls in WPE WebKit, and building that is a four-hour job a hosted
      # runner has not the disk for. It substitutes from the project's cache
      # now — measured at 409s for the whole thing, against 53s for the C
      # build beside it — so the gate it was behind has no reason left, and
      # the feature is checked on every push instead of never.
      #
      # `nix build` rather than `cargo build --features wpe`: the feature needs
      # wpe-platform and wpe-webkit found by pkg-config, and .#viewport-smithay
      # is where that plumbing already lives.
      #
      # Its own tests stay off — buildRustPackage would run them inside the nix
      # sandbox, which has neither a GPU nor a socket, and the steps above have
      # already run the suite outside it.
      # Stop before spending four hours discovering the cache went stale.
      #
      # The step below is affordable only because WPE WebKit substitutes. If it
      # ever does not — flake.lock moves the nixpkgs input, the bucket is
      # garbage-collected, a signature stops verifying — nix says nothing and
      # starts compiling, and a hosted runner does not fail on that quickly. It
      # has 14 GB of disk against a 20-40 GB build tree, so it grinds for hours
      # and then dies on ENOSPC, which reads as an infrastructure fault rather
      # than the cache miss it is.
      #
      # `--dry-run` says what nix is about to do. Anything named between "will
      # be built" and "will be fetched" is a source build, so wpewebkit
      # appearing there is the failure, caught in seconds with the reason
      # attached.
      #
      # Note the two outputs: `out` is what gets linked and `dev` is what
      # pkg-config reads, they are siblings rather than one containing the
      # other, and a cache holding only the first still triggers a full
      # rebuild. That is exactly how this was discovered.
      - name: Refuse to build WPE WebKit
        run: |
          plan=$(nix build --dry-run .#viewport-smithay --log-format raw 2>&1)
          building=$(printf '%s\n' "$plan" \
            | sed -n '/will be built/,/will be fetched/p' \
            | grep wpewebkit || true)
          if [ -n "$building" ]; then
            printf '%s\n' "$building"
            echo "::error::WPE WebKit is not substitutable from the binary" \
                 "cache, so this run would build it from source — hours, and" \
                 "more disk than this runner has. Check that both the out and" \
                 "dev outputs of .#wpewebkit are in the cache."
            exit 1
          fi
          echo "wpewebkit substitutes; not building it"

      - name: Build with the web engine
        run: nix build --print-build-logs .#viewport-smithay

  # The same suite under AddressSanitizer.
  #
  # Narrower than it looks, and worth saying why it is not redundant with the
  # job above. Rust already rules out the use-after-free that ASan over the C
  # compositor kept finding — outputs and views outliving what points at them.
  # What it does not rule out is the ~187 `unsafe` blocks and the FFI: WebKit,
  # EGL, libinput, Vulkan. That boundary is where the memory bugs still are,
  # and instrumenting the Rust side covers *both* halves of it, which the C
  # sanitizer job never did.
  #
  # It is also not a replacement for the hotplug churn in
  # crates/viewport/tests/control_socket.rs. The mistake that outlives Rust's
  # guarantees is a stale view id or a WeakOutput that stops upgrading — a
  # logic bug no sanitizer sees. The churn is the test; this makes its failures
  # louder.
  #
  # A separate job rather than a step, so it runs beside `rust` instead of
  # after it: -Zbuild-std recompiles the standard library with the same
  # instrumentation, which is most of the wall clock here and is also the
  # point. Without it std is uninstrumented and an overflow inside a Vec
  # operation reads as a clean run.
  #
  # ASAN_OPTIONS comes from devShells.asan, beside the reason it is set.
  asan:
    name: Rust under ASan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v4
        with:
          extra-conf: |
            extra-substituters = https://codebam-nix-cache.storage.googleapis.com
            extra-trusted-public-keys = codebam-nix-cache-1:ZiBhSEjcy3Y53eTmQIdJsa1T1T6fCrh52EK22amzkD0=
      - uses: DeterminateSystems/magic-nix-cache-action@v2

      - name: Test under AddressSanitizer
        run: |
          nix develop .#asan --command bash -euo pipefail -c '
            export RUSTFLAGS="-Zsanitizer=address"
            cargo test --workspace \
              --target x86_64-unknown-linux-gnu -Zbuild-std
          '

  # Builds .#wpewebkit on its own and pushes the closure to Cachix, so that the
  # compositor and sanitizer jobs have something to substitute. Never runs on a
  # push: it is workflow_dispatch, plus a weekly refresh.
  #
  # A fork has neither the variable nor the secret. Both are checked rather
  # than assumed — the job is skipped outright without CACHIX_CACHE, and the
  # steps that need write access are gated on the token being non-empty, so a
  # fork sees a green no-op instead of a cachix push failing on nothing to
  # authenticate with. The secrets context is not available in a job-level
  # if:, which is why the token test is a step and not part of the guard.
  wpewebkit-cache:
    name: Build and cache WPE WebKit
    if: |
      (github.event_name == 'workflow_dispatch' ||
       github.event_name == 'schedule') && vars.CACHIX_CACHE != ''
    runs-on: >-
      ${{ vars.WEBKIT_RUNNER || vars.COMPOSITOR_RUNNER
      || 'ubuntu-latest' }}
    # WebKit on four cores is hours, not minutes, and the default 360 is the
    # hosted ceiling anyway; this only makes the failure legible.
    timeout-minutes: 350
    steps:
      - name: Check for a cache token
        id: token
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [ -n "${CACHIX_AUTH_TOKEN:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "no CACHIX_AUTH_TOKEN; nothing to push to" >&2
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'

      # This is the step that decides whether the job can work at all on a
      # hosted runner. The root volume has around 14 GB free and the build
      # tree wants 20-40; /mnt is a separate ~65 GB scratch disk that nothing
      # uses. Bind-mounting /nix onto it before Nix is installed puts the
      # store, and every unpacked source tree under it, on the large volume.
      # The preinstalled Android and .NET toolchains go too, since the daemon
      # still builds under /tmp on the root volume.
      #
      # It is close even so. If WebKit still fills the disk, point
      # WEBKIT_RUNNER at a machine with room rather than trimming more here.
      - name: Make room for a WebKit build tree
        if: steps.token.outputs.present == 'true' && !vars.WEBKIT_RUNNER
        run: |
          set -eux
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet \
            /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo mkdir -p /mnt/nix /nix
          sudo mount --bind /mnt/nix /nix
          df -h / /mnt

      # The project's cache here too, which sounds redundant in the job whose
      # purpose is to build WebKit and is not: this rebuilds when flake.lock
      # moves the input, and everything *else* in the closure — the whole
      # nixpkgs stdenv the engine is built against — is what it substitutes.
      - uses: cachix/install-nix-action@v27
        if: steps.token.outputs.present == 'true'
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://codebam-nix-cache.storage.googleapis.com
            extra-trusted-public-keys = codebam-nix-cache-1:ZiBhSEjcy3Y53eTmQIdJsa1T1T6fCrh52EK22amzkD0=

      # With a token this both substitutes and pushes: everything the job adds
      # to the store lands in the cache when the job ends.
      - uses: cachix/cachix-action@v15
        if: steps.token.outputs.present == 'true'
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # The engine alone, not .#viewport: the compositor is 8k lines of C that
      # every other job can compile in a minute, and building it here would
      # cache an output invalidated by the next commit.
      - name: Build WPE WebKit
        if: steps.token.outputs.present == 'true'
        run: nix build --print-build-logs .#wpewebkit
