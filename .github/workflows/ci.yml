# Five jobs. Two run on every push; three want something a hosted runner has
# not got.
#
# `shell` and `rust` are unassisted. The layout engine is plain JavaScript and
# needs nothing but node. The Rust rewrite needs no WPE WebKit either — the web
# engine is behind a non-default feature — and its headless backend renders
# through surfaceless EGL, so it runs the Wayland integration tests on a
# machine with no GPU at all.
#
# The other three want WebKit, a DRM render node, or both:
#
#   - WebKit is no longer the obstacle it was. flake.nix builds it from an
#     upstream tarball with an overridden src, which no public cache has, and
#     a hosted runner has 14 GB of disk against a 20-40 GB build tree — it runs
#     out of disk rather than time. But the project's own bucket now carries
#     it, every job here is configured to substitute from it, and
#     `nix build .#viewport` takes about a minute as a result.
#
#   - A DRM render node still is. The wlroots compositor in src/ cannot start
#     without one: `wlr_renderer_autocreate` enumerates /dev/dri/renderD* and a
#     hosted runner has none. Pointing Vulkan at lavapipe does not help — that
#     supplies a device, not a DRM fd — which was assumed here for a long time
#     and was never true, because these jobs sat behind a repository variable
#     from the day they were written. The meson tests now detect the node and
#     skip rather than fail; set COMPOSITOR_RUNNER to a machine with a GPU and
#     they run themselves.
#
# The wpewebkit-cache job builds the engine on demand and pushes it to Cachix.
# It is never triggered by a push.
name: CI

on:
  push:
  pull_request:
  # For the cache job only. Nothing else in this file reads these events; the
  # job that does checks github.event_name so a push cannot start a four-hour
  # WebKit build by accident.
  workflow_dispatch:
  schedule:
    # Weekly, because the derivation is pinned in flake.lock and only changes
    # when that input moves. This is a refresh against cache garbage
    # collection, not a rebuild.
    - cron: '17 4 * * 1'

# A push to a branch with an open pull request fires both events, and there is
# no reason to run the same commit twice.
#
# Keyed on head_ref, not ref: for a pull_request event github.ref is the merge
# ref, refs/pull/<n>/merge, while the push that triggered it carries
# refs/heads/<branch>. Keying on github.ref alone puts the two in different
# groups, so neither cancels the other. github.head_ref is set only on
# pull_request, which is exactly when the substitution is needed.
#
# Scheduled and dispatched runs get a group of their own. They carry
# github.ref of the default branch, so without the suffix any push to main
# would cancel-in-progress a WebKit build that has been running for hours and
# is minutes from populating the cache.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.head_ref || github.ref }}-${{
    (github.event_name == 'schedule' ||
    github.event_name == 'workflow_dispatch') && github.event_name || 'ci' }}
  cancel-in-progress: true

jobs:
  # The tiling tree, the scrolling layout, and the restore-a-saved-session
  # path. Nothing here touches Wayland or the compositor binary — the tests
  # stub the DOM and run the real data/shell scripts, so a broken layout tree
  # is caught here rather than by looking at screenshots.
  #
  # The JSON accessor tests ride along here for the same reason: they link
  # nothing but json-glib, so they need neither WebKit nor a Wayland socket and
  # there is no reason to make them wait on the cache.
  #
  # They are compiled directly rather than through meson, which is the part
  # worth explaining. meson.build declares wlroots and wpe-webkit at the top
  # level, so `meson setup` fails on a runner that has neither — even for a
  # target that uses neither. Two files and a pkg-config call reach the same
  # binary without configuring the project at all. `meson test` still runs it
  # locally and in the compositor job; this is the same code, checked earlier.
  shell:
    name: Shell logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Run the four combinations meson would, but directly. meson makes these
      # optional so a checkout without node still gets the compositor tests;
      # here that rule is backwards, and naming each one means a missing
      # variant fails loudly instead of quietly not running.
      - name: Layout tests
        run: |
          set -eux
          node tests/shell.test.js data/shell tiling
          node tests/shell.test.js data/shell scrolling
          node tests/shell.test.js data/shell tiling session
          node tests/shell.test.js data/shell scrolling session
          node tests/kiosk.test.js examples/kiosk

      - name: Install json-glib
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libjson-glib-dev

      # The type-checked accessors that stand between a page's postMessage and
      # the dispatch table. Both of the crashes fixed in the IPC parser were a
      # member that was present but not of the type the reader assumed, so this
      # is the one piece of C where a wrong answer is a remote crash.
      - name: JSON accessor tests
        run: |
          set -eux
          cc -std=c11 -Wall -Wextra -Wno-unused-parameter -Iinclude \
            -o unit-test tests/unit.c src/json_util.c \
            $(pkg-config --cflags --libs json-glib-1.0)
          ./unit-test

  # The Rust rewrite: fmt, clippy and the whole test suite, on every push.
  #
  # This runs unassisted for the same reason the shell job does — it needs
  # nothing that a hosted runner cannot substitute in seconds. The web engine
  # is behind the `wpe` feature, off by default, and crates/viewport-web's
  # build.rs only probes pkg-config when it is on, so `cargo test --workspace`
  # links Smithay, DRM, libinput and libseat and no WebKit at all. `.#rust` is
  # the devshell that carries exactly that and nothing else; `.#default` would
  # drag in wlroots, WPE and a Servo recipe and put this job behind the same
  # cache gate as the compositor ones.
  #
  # -D warnings rather than a bare clippy run: the point is that a warning
  # fails the build. The three lints that are deliberate carry an #[allow] and
  # a comment saying why, which is the form an exception should take.
  rust:
    name: Rust rewrite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The project's own binary cache, on every job that evaluates this flake.
      #
      # flake.nix declares it in nixConfig, and that is not enough anywhere:
      # nixConfig applies to interactive evaluation and only with
      # accept-flake-config, so a runner reads none of it. Configuring the
      # installer is what makes it real.
      #
      # Read-only and unauthenticated — the bucket is public, so there is no
      # secret here and a fork gets the same substitutions. The public key
      # matters as much as the URL: without it nix reaches the bucket and
      # rejects every narinfo in it as unsigned, which fails silently and looks
      # exactly like a cache with nothing in it.
      - uses: DeterminateSystems/nix-installer-action@v4
        with:
          extra-conf: |
            extra-substituters = https://codebam-nix-cache.storage.googleapis.com
            extra-trusted-public-keys = codebam-nix-cache-1:ZiBhSEjcy3Y53eTmQIdJsa1T1T6fCrh52EK22amzkD0=
      - uses: DeterminateSystems/magic-nix-cache-action@v2

      # One `nix develop` for all three, so the shell is realised once. Split
      # into separate steps and each would pay for it again.
      #
      # Ordered cheapest-first: a formatting diff is a one-line fix and there
      # is no reason to spend a compile finding it. `set -euo pipefail` because
      # a bare multi-line run: stops at the last command's status, which would
      # let a clippy failure through whenever the tests passed.
      - name: Format, lint and test
        run: |
          nix develop .#rust --command bash -euo pipefail -c '
            cargo fmt --all --check
            cargo clippy --workspace --all-targets -- -D warnings
            cargo test --workspace
          '

      # The Wayland integration tests — capture, session lock, output order —
      # against the binary just built. These are what "parity" means in
      # docs/RUST-REWRITE.md, and until now the only thing that ran them
      # against this compositor was a person remembering to.
      #
      # Unassisted for two reasons that both had to become true. The clients
      # they drive link wayland-client and the generated marshalling code and
      # nothing else, so scripts/integration.sh compiles them directly rather
      # than through meson, which would want wlroots at setup time. And the
      # compositor no longer needs a device node: its headless backend renders
      # through a surfaceless EGL display, which on a runner with no /dev/dri
      # is Mesa's software rasteriser.
      #
      # The default-features binary, deliberately — no `wpe`, so no WebKit.
      # The shell is not under test here; a headless compositor without one
      # falls back to a built-in layout after 2500ms, which is what these
      # clients are placed by.
      - name: Wayland integration tests
        env:
          # No GPU on a hosted runner, so this is where it lands anyway.
          # Named rather than left to chance: a machine that does have one
          # would otherwise test a different driver than CI does.
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          nix develop .#rust --command bash -euo pipefail -c '
            cargo build --bin viewport
            scripts/integration.sh target/debug/viewport
          '

      # The `wpe` half, which none of the above compiles: `cargo` here builds
      # the default features, leaving everything inside
      # `#[cfg(feature = "wpe")]` untouched — the shell, the DMA-BUF import,
      # the WPE shim, which is to say the reason the compositor exists.
      #
      # This used to live in the compositor job because turning the feature on
      # pulls in WPE WebKit, and building that is a four-hour job a hosted
      # runner has not the disk for. It substitutes from the project's cache
      # now — measured at 409s for the whole thing, against 53s for the C
      # build beside it — so the gate it was behind has no reason left, and
      # the feature is checked on every push instead of never.
      #
      # `nix build` rather than `cargo build --features wpe`: the feature needs
      # wpe-platform and wpe-webkit found by pkg-config, and .#viewport-smithay
      # is where that plumbing already lives.
      #
      # Its own tests stay off — buildRustPackage would run them inside the nix
      # sandbox, which has neither a GPU nor a socket, and the steps above have
      # already run the suite outside it.
      - name: Build with the web engine
        run: nix build --print-build-logs .#viewport-smithay

  # Builds .#wpewebkit on its own and pushes the closure to Cachix, so that the
  # compositor and sanitizer jobs have something to substitute. Never runs on a
  # push: it is workflow_dispatch, plus a weekly refresh.
  #
  # A fork has neither the variable nor the secret. Both are checked rather
  # than assumed — the job is skipped outright without CACHIX_CACHE, and the
  # steps that need write access are gated on the token being non-empty, so a
  # fork sees a green no-op instead of a cachix push failing on nothing to
  # authenticate with. The secrets context is not available in a job-level
  # if:, which is why the token test is a step and not part of the guard.
  wpewebkit-cache:
    name: Build and cache WPE WebKit
    if: |
      (github.event_name == 'workflow_dispatch' ||
       github.event_name == 'schedule') && vars.CACHIX_CACHE != ''
    runs-on: >-
      ${{ vars.WEBKIT_RUNNER || vars.COMPOSITOR_RUNNER
      || 'ubuntu-latest' }}
    # WebKit on four cores is hours, not minutes, and the default 360 is the
    # hosted ceiling anyway; this only makes the failure legible.
    timeout-minutes: 350
    steps:
      - name: Check for a cache token
        id: token
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [ -n "${CACHIX_AUTH_TOKEN:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "no CACHIX_AUTH_TOKEN; nothing to push to" >&2
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'

      # This is the step that decides whether the job can work at all on a
      # hosted runner. The root volume has around 14 GB free and the build
      # tree wants 20-40; /mnt is a separate ~65 GB scratch disk that nothing
      # uses. Bind-mounting /nix onto it before Nix is installed puts the
      # store, and every unpacked source tree under it, on the large volume.
      # The preinstalled Android and .NET toolchains go too, since the daemon
      # still builds under /tmp on the root volume.
      #
      # It is close even so. If WebKit still fills the disk, point
      # WEBKIT_RUNNER at a machine with room rather than trimming more here.
      - name: Make room for a WebKit build tree
        if: steps.token.outputs.present == 'true' && !vars.WEBKIT_RUNNER
        run: |
          set -eux
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet \
            /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo mkdir -p /mnt/nix /nix
          sudo mount --bind /mnt/nix /nix
          df -h / /mnt

      # The project's cache here too, which sounds redundant in the job whose
      # purpose is to build WebKit and is not: this rebuilds when flake.lock
      # moves the input, and everything *else* in the closure — the whole
      # nixpkgs stdenv the engine is built against — is what it substitutes.
      - uses: cachix/install-nix-action@v27
        if: steps.token.outputs.present == 'true'
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://codebam-nix-cache.storage.googleapis.com
            extra-trusted-public-keys = codebam-nix-cache-1:ZiBhSEjcy3Y53eTmQIdJsa1T1T6fCrh52EK22amzkD0=

      # With a token this both substitutes and pushes: everything the job adds
      # to the store lands in the cache when the job ends.
      - uses: cachix/cachix-action@v15
        if: steps.token.outputs.present == 'true'
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # The engine alone, not .#viewport: the compositor is 8k lines of C that
      # every other job can compile in a minute, and building it here would
      # cache an output invalidated by the next commit.
      - name: Build WPE WebKit
        if: steps.token.outputs.present == 'true'
        run: nix build --print-build-logs .#wpewebkit

  # Builds the compositor and drives real Wayland clients against a headless
  # instance: tests/capture.test.sh and tests/lock.test.sh.
  #
  # Disabled by default because it cannot pass on a stock hosted runner (see
  # the note at the top of this file). Three ways to turn it on, in order of
  # how much work they are:
  #
  #   1. Set the repository variable CACHIX_CACHE and the CACHIX_AUTH_TOKEN
  #      secret, then run the "Build and cache WPE WebKit" job above by hand
  #      once. It builds .#wpewebkit and pushes the closure; from then on this
  #      job substitutes the engine and compiles only the C. The derivation is
  #      pinned in flake.lock, so it is rebuilt only when that input moves and
  #      the weekly schedule keeps it alive against garbage collection.
  #      Finally set COMPOSITOR_CI to "true".
  #
  #   2. Populate a binary cache with the wpewebkit derivation, so CI
  #      substitutes it instead of building it. Build it once on a real
  #      machine and push the closure:
  #
  #        nix build .#viewport
  #        nix run nixpkgs#cachix -- push <cache-name> ./result
  #
  #      then set the repository variable COMPOSITOR_CI to "true" and add
  #      CACHIX_CACHE plus the CACHIX_AUTH_TOKEN secret. A cache hit brings
  #      the job in well under the disk and time limits; it only rebuilds
  #      when flake.lock or the derivation actually changes.
  #
  #   3. Point it at a self-hosted runner with the disk to spare, by setting
  #      COMPOSITOR_RUNNER to that runner's label.
  compositor:
    name: Compositor and Wayland tests
    if: vars.COMPOSITOR_CI == 'true'
    runs-on: ${{ vars.COMPOSITOR_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      # The project's own cache, as in the `rust` job above. This is the job
      # that most wants it: `nix build .#viewport-smithay` needs WPE WebKit,
      # and building that from source is the four-hour job below.
      - uses: DeterminateSystems/nix-installer-action@v4
        with:
          extra-conf: |
            extra-substituters = https://codebam-nix-cache.storage.googleapis.com
            extra-trusted-public-keys = codebam-nix-cache-1:ZiBhSEjcy3Y53eTmQIdJsa1T1T6fCrh52EK22amzkD0=
      - uses: DeterminateSystems/magic-nix-cache-action@v2

      # Cachix as well, if it is configured. Two substituters is not a
      # conflict — nix asks each in turn — and the two were populated by
      # different routes, so having both is strictly more likely to hit.
      #
      # Read-only: this job wants the engine out of the cache, it has nothing
      # worth putting in. skipPush also means a public cache works here with
      # no secret at all, which is what makes the job survive a fork.
      - uses: cachix/cachix-action@v15
        if: vars.CACHIX_CACHE != ''
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      # tests/capture.test.sh and tests/lock.test.sh both do
      #   export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/tmp}"
      # and a hosted runner never sets it, so without this the Wayland socket
      # and its lock file land in a world-writable /tmp shared with every
      # other process on the machine. Give them the private 0700 directory
      # the spec describes instead.
      - name: Provide a runtime directory
        run: |
          mkdir -p "$RUNNER_TEMP/xdg-runtime"
          chmod 700 "$RUNNER_TEMP/xdg-runtime"
          echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/xdg-runtime" >> "$GITHUB_ENV"

      # Only on a runner that has a GPU, which is the only kind that gets past
      # the test gate below — and there the point is to use the *real* driver.
      #
      # This step used to run unconditionally, on the theory that lavapipe
      # made a GPU unnecessary. It does not, and worse, forcing it on a
      # machine that does have one would break the case that works: lavapipe
      # exposes no DRM node, and wlroots wants a DRM fd rather than merely a
      # Vulkan device. So this now picks the host's own ICD and only exists
      # to be explicit about which device is in use.
      #
      # VK_ICD_FILENAMES is the older spelling of VK_DRIVER_FILES; which one
      # is read depends on the loader version, so both were set. Neither is
      # set now — the loader's own search finds the driver that owns the node
      # wlroots is going to open, and naming one by hand can only disagree
      # with it.
      - name: Report the render device
        run: |
          set -- /dev/dri/renderD*
          if [ -e "$1" ]; then
            echo "render nodes: $*"
          else
            echo "no render node; the wlroots tests below will skip"
          fi

      - name: Build
        run: nix build --print-build-logs .#viewport

      # Only the Wayland tests here; the shell job already covered the rest,
      # and running them twice would just make a node-less runner look green.
      # Only where there is a DRM render node, which a hosted runner has not
      # got.
      #
      # The step above this one used to claim lavapipe made these runnable
      # anywhere. It does not: an ICD gives you a Vulkan *device*, and wlroots
      # separately wants a DRM fd — `wlr_renderer_autocreate` enumerates
      # /dev/dri/renderD* and finds nothing, so the compositor exits before it
      # publishes a socket and all three tests fail in 0.15s with
      #
      #   [render/wlr_renderer.c:130] Failed to find any DRM render node
      #
      # That was never true, and nobody found out because this job sat behind
      # a repository variable from the day it was written until 2026-07-30.
      # Forcing pixman is not the escape either — the web engine needs a DRM fd
      # of its own, which is why tests/lock.test.sh leaves the renderer alone.
      #
      # Skipping rather than failing, and detected rather than declared: point
      # COMPOSITOR_RUNNER at a machine with a GPU and these run themselves,
      # with no second variable to remember to set.
      #
      # The Rust rewrite runs the same three scripts unassisted in the `rust`
      # job — its headless backend renders through surfaceless EGL and never
      # asks for a device node — so this is coverage deferred, not lost.
      - name: Test
        run: |
          set -- /dev/dri/renderD*
          if [ ! -e "$1" ]; then
            echo "::notice::no DRM render node on this runner; the wlroots" \
                 "compositor cannot start, so the Wayland tests are skipped." \
                 "Set COMPOSITOR_RUNNER to a machine with a GPU to run them."
            exit 0
          fi
          nix develop --command bash -euo pipefail -c '
            meson setup build
            meson test -C build --print-errorlogs \
              session-lock-crash capture-tiling capture-scrolling
          '

      - name: Upload the test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: meson-testlog
          path: build/meson-logs/testlog.txt
          if-no-files-found: warn

  # The same Wayland tests again, against a binary built with ASan and UBSan.
  #
  # Worth the second run because of what this compositor gets wrong: outputs
  # and views outlive the structures that point at them. A monitor that
  # disconnects mid-frame corrupted the heap and was only found by running the
  # hotplug churn in scripts/asan-hotplug.sh under a sanitizer; the same
  # family of bug has been fixed several times. Unsanitized, those failures
  # look like a test that passed, or a crash somewhere unrelated hours later.
  #
  # Gated on the same variable as the compositor job because it links the same
  # WebKit and needs the same populated cache to be affordable.
  sanitizers:
    name: Compositor under ASan and UBSan
    if: vars.COMPOSITOR_CI == 'true'
    runs-on: ${{ vars.COMPOSITOR_RUNNER || 'ubuntu-latest' }}
    env:
      # Leak checking is off for the same reason scripts/asan-hotplug.sh turns
      # it off: WebKit and the Wayland libraries hold one-time allocations at
      # exit and every run would be red for reasons that are not this
      # project's. Use-after-free and out-of-bounds, the bugs actually being
      # hunted, are unaffected.
      ASAN_OPTIONS: detect_leaks=0:detect_odr_violation=0:abort_on_error=1
      # UBSan only warns by default, and a warning in a log nobody reads is
      # not a test result. Make it fatal so the meson test fails.
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4

      # As in the compositor job: this one links the same WebKit.
      - uses: DeterminateSystems/nix-installer-action@v4
        with:
          extra-conf: |
            extra-substituters = https://codebam-nix-cache.storage.googleapis.com
            extra-trusted-public-keys = codebam-nix-cache-1:ZiBhSEjcy3Y53eTmQIdJsa1T1T6fCrh52EK22amzkD0=
      - uses: DeterminateSystems/magic-nix-cache-action@v2

      - uses: cachix/cachix-action@v15
        if: vars.CACHIX_CACHE != ''
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      - name: Provide a runtime directory
        run: |
          mkdir -p "$RUNNER_TEMP/xdg-runtime"
          chmod 700 "$RUNNER_TEMP/xdg-runtime"
          echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/xdg-runtime" >> "$GITHUB_ENV"

      # See the compositor job. Same story: lavapipe was named here by hand and
      # could not have worked, because wlroots wants a DRM fd rather than
      # merely a Vulkan device. It matters more here — pixman cannot bring the
      # compositor up at all, so a sanitizer job that fell back to it would
      # report nothing forever.
      - name: Report the render device
        run: |
          set -- /dev/dri/renderD*
          if [ -e "$1" ]; then
            echo "render nodes: $*"
          else
            echo "no render node; the sanitizer run below will skip"
          fi

      # build-asan is the directory scripts/asan-hotplug.sh expects, so the
      # tree CI produces is the tree a maintainer already knows how to drive.
      #
      # b_lundef=false is not optional: meson passes -Wl,--no-undefined by
      # default, and the sanitizer runtimes leave interposed symbols to be
      # resolved at load time, so the link fails without it.
      # Same gate as the job above, for the same reason: no DRM render node,
      # no wlroots compositor, and a sanitizer finds nothing in a process that
      # exits during renderer setup.
      - name: Test
        run: |
          set -- /dev/dri/renderD*
          if [ ! -e "$1" ]; then
            echo "::notice::no DRM render node on this runner; the wlroots" \
                 "compositor cannot start, so the sanitizer run is skipped." \
                 "Set COMPOSITOR_RUNNER to a machine with a GPU to run it."
            exit 0
          fi
          nix develop --command bash -euo pipefail -c '
            meson setup build-asan \
              -Db_sanitize=address,undefined -Db_lundef=false
            meson test -C build-asan --print-errorlogs \
              session-lock-crash capture-tiling capture-scrolling
          '

      - name: Upload the test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: meson-testlog-asan
          path: build-asan/meson-logs/testlog.txt
          if-no-files-found: warn
