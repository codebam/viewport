# xdg-desktop-portal 1.18+ selects backends from a config file rather than the
# UseIn= line in a .portal file, which is deprecated and ignored by 1.20.
# Without this the Settings interface has no backend at all — and because
# XDG_CURRENT_DESKTOP=viewport also disqualifies the GTK backend, the result is
# NotFound and every application falls back to a light theme.
[preferred]
default=viewport
org.freedesktop.impl.portal.Settings=viewport
