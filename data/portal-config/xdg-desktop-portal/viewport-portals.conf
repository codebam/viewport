# xdg-desktop-portal 1.18+ selects backends from a config file rather than the
# UseIn= line in a .portal file, which is deprecated and ignored by 1.20.
#
# Settings has to name us: XDG_CURRENT_DESKTOP=viewport disqualifies the GTK
# backend, so without this the interface has no backend at all and every
# application falls back to a light theme.
#
# ScreenCast names us first now: the compositor implements that interface
# itself, because xdg-desktop-portal-wlr can only offer monitors — it captures
# through wlr-screencopy, which captures outputs and nothing else — so an
# application asking to share a window was handed a whole screen. wlr stays
# behind us for a session running the C build, which does not answer it.
#
# RemoteDesktop names us for the same reason and with the same fallback. It is
# the ScreenCast interface plus input injection, it is served from the same
# object on the same bus name out of the same session table, and the frontend
# uses one session handle across both — so the two have to be answered by the
# same backend or a session created on one is unknown to the other. Naming
# viewport for ScreenCast and leaving RemoteDesktop to another implementation
# is the configuration that cannot work.
#
# GlobalShortcuts names us for the plainest reason there is: a global shortcut
# is a chord that has to be resolved before the focused window sees the key,
# and the compositor is the only thing in the session that sees a key first.
# A backend that is not the compositor can answer the interface and never hear
# the chord.
#
# Inhibit names us because nothing else in this session can answer it: the
# thing being inhibited is the compositor's own idle timer, which is where the
# lock and blank deadlines live. Only version 1 is implemented — the interface
# has no logout dialog to draw here, see crates/viewport/src/inhibit.rs — and
# gtk stays behind us for a session running something that does.
#
# Screenshot still goes to wlr, and the way this went wrong once is worth
# recording. "default=viewport" made us the preferred backend for every
# interface, including ones we do not implement. The frontend's answer to that
# is not a failing call: it does not expose the interface at all. Firefox's
# getDisplayMedia rejects with no sources, OBS offers no screen capture, and
# nothing in any journal mentions a portal or a desktop name.
#
# "default=gtk;*" keeps everything not named here working — GTK where it has an
# implementation, anything else that turns up otherwise.
[preferred]
default=gtk;*
org.freedesktop.impl.portal.Settings=viewport;gtk
org.freedesktop.impl.portal.ScreenCast=viewport;wlr
org.freedesktop.impl.portal.RemoteDesktop=viewport;wlr
org.freedesktop.impl.portal.Screenshot=viewport;wlr
org.freedesktop.impl.portal.Inhibit=viewport;gtk
org.freedesktop.impl.portal.GlobalShortcuts=viewport;gnome
