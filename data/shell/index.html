<!doctype html>
<meta charset="utf-8">
<title>Viewport shell</title>
<link rel="stylesheet" href="shell.css">

<!--
  Reference shell.

  Everything visible here is ordinary DOM: the wallpaper, the bar, and the
  frame around each window. What is *not* here is the window contents. Each
  `.viewport` element is a hole — the compositor paints the real Wayland client
  into the screen rect that element occupies.

  Layout is therefore just CSS. The tiling tree below renders to nested
  flexboxes and the browser computes every rectangle; the shell only measures
  where each hole landed and reports it. Splits, moves and fullscreen change
  the tree, never the geometry directly.
-->

<div id="outputs"></div>

<!--
  The screen-share chooser. Outside the outputs for the same reason as the
  notifications: it belongs to the session rather than to one desktop, and it
  is drawn over whichever one is being looked at.
-->
<div id="screencast" role="dialog" aria-label="Screen sharing" hidden></div>

<!--
  An open tray menu. Page level for the same reason again: it belongs to the
  item that was clicked rather than to a desktop, and it is positioned in
  layout coordinates, which is what the page is measured in.
-->
<div id="tray-menu" hidden></div>

<!--
  The clipboard history picker, opened with Mod4+Shift+v. Page level like the
  chooser above: it belongs to the session rather than to one desktop.
-->
<div id="clipboard" hidden></div>

<!--
  The launcher, opened with Mod4+d. Page level for the same reason as the
  picker above: it belongs to the session rather than to one desktop, and the
  filter field inside it holds the keyboard while it is up, which is a
  session-wide thing to be doing.
-->
<div id="launcher" hidden></div>

<!--
  The notification centre, opened with Mod4+Shift+m. Page level for the same
  reason as the picker above: what has been notified belongs to the session
  rather than to one desktop, and the list is drawn over whichever one is
  being looked at.
-->
<div id="notification-centre" hidden></div>

<!--
  The power-profile picker, opened by clicking the battery widget. Page
  level like the clipboard: it belongs to the session rather than to one
  desktop.
-->
<div id="power-picker" hidden></div>

<!--
  The wireless network picker and the Bluetooth picker, opened with
  Mod4+Shift+n and Mod4+Shift+t. Page level like the two above: a radio belongs
  to the machine rather than to one desktop, and the passphrase box inside the
  first one holds the keyboard while it is up, which is a session-wide thing to
  be doing.
-->
<div id="network-picker" hidden></div>
<div id="bluetooth-picker" hidden></div>

<!--
  The on-screen keyboard. Page level like everything above it, and for the
  same reason: what it types into is whichever client has the keyboard, not
  one desktop. It comes up on its own when a text field asks for it, or with
  Mod4+Shift+k.
-->
<div id="osk" role="group" aria-label="On-screen keyboard" hidden></div>

<template id="desktop-template">
  <main class="desktop">
    <!--
      Roles and labels rather than shape alone. The desktop is a web page, so
      the engine builds a real accessibility tree out of this markup and hands
      it to whatever is reading — see docs/shell-backends.md on which backends
      currently manage that last step. What is here has to be right first: a
      bar full of unlabelled `<span>`s is a tree with nothing in it whether or
      not the bus is ever connected, and the labels are the half that costs
      nothing now and cannot be inferred later.

      Every module carries its `title` twice, as `title` and as `aria-label`.
      They are not the same thing: a `title` is a tooltip, which is a hover,
      which is a pointer — and a reader is told the accessible name, which a
      `title` supplies only when nothing better exists. Saying it outright is
      one attribute and removes the guess. `aria-live="polite"` on the ones
      that change on their own is what makes a clock or a battery readable
      without the reader having to be asked again; `off` everywhere else,
      because a bar that announced every CPU sample would be unusable.
    -->
    <nav class="bar" aria-label="Status bar">
      <div class="bar-left">
        <div class="workspaces" role="group" aria-label="Workspaces"></div>
        <div class="taskbar" role="group" aria-label="Open windows"></div>
      </div>
      <div class="bar-right">
        <span class="mode" aria-live="polite" hidden></span>
        <span class="module tray" role="group" aria-label="System tray"></span>
        <span class="module net" title="network" aria-label="network"></span>
        <span class="module disk" title="free on /" aria-label="free on /"></span>
        <span class="module cpu" title="cpu" aria-label="cpu"></span>
        <span class="module load" title="load average" aria-label="load average"></span>
        <span class="module memory" title="memory" aria-label="memory"></span>
        <span class="module clock" aria-live="polite" aria-label="clock"></span>
      </div>
    </nav>

    <div class="windows"></div>

    <!-- Something arrived and said so out loud. `polite` and not `assertive`:
         a notification interrupts what is on screen, not what is being read
         aloud, and the record of it is a keystroke away in the centre. -->
    <div class="notifications" role="log" aria-live="polite"
         aria-label="Notifications"></div>

    <div class="empty">
      <!--
        The mark: a viewport. An outer frame, and inside it a second frame
        offset as though the first were a window onto it — which is what the
        compositor is, and what the shell is drawing right now.

        Inline rather than a file: it is a dozen elements, it inherits
        currentColor so it follows the theme with no second place to set
        colours, and a file:// shell that has to fetch its own logo has one
        more thing that can fail to load.
      -->
      <svg class="logo" viewBox="0 0 64 64" role="img" aria-label="Viewport"
           fill="none" stroke="currentColor" stroke-width="2.5"
           stroke-linejoin="round">
        <rect x="4" y="10" width="42" height="32" rx="4"/>
        <rect x="18" y="22" width="42" height="32" rx="4" opacity=".55"/>
      </svg>
      <!--
        The keys, filled in by the shell from what the compositor says is
        really bound — see renderKeybinds(). The two lines here are what an
        empty desktop showed before the compositor sent its keymap, and are
        what it still shows if it does not: a shell that cannot say what the
        keys are should say the two that start a terminal and a launcher
        rather than nothing at all.
      -->
      <div class="tutorial">
        <p>Launch a client against <code>$WAYLAND_DISPLAY</code>.</p>
        <pre class="keys">Mod4+Return  terminal
Mod4+d       launcher</pre>
      </div>
    </div>
  </main>
</template>

<!--
  A window is a border and a hole. No titlebar, no close button: the compositor
  requests server-side decorations so clients draw none either.
-->
<template id="window-template">
  <section class="window">
    <div class="viewport"></div>
  </section>
</template>

<!-- The tween engine, vendored. A file:// page resolves no packages and
     fetches nothing, so what the shell loads is a built copy checked in
     beside it; the version is declared in package.json at the repository
     root and refreshed by scripts/vendor-shell-deps.sh. First, because
     motion.js reads the global it defines. See vendor/README.md — its
     licence is not this repository's. -->
<script src="vendor/gsap.min.js"></script>

<!-- Ordered classic scripts, not modules: they share one global scope,
     so a binding declared in state.js is the same binding everywhere.
     This order is the shell's load order and the only place it is
     defined — tests/shell.test.js reads these tags rather than keeping
     a second list that could drift. See shell.md. -->
<script src="state.js"></script>
<script src="motion.js"></script>
<script src="keys.js"></script>
<script src="tiling.js"></script>
<script src="scrolling.js"></script>
<script src="dynamic.js"></script>
<script src="solar.js"></script>
<script src="matrix.js"></script>
<script src="canvas.js"></script>
<script src="session.js"></script>
<script src="resize.js"></script>
<script src="geometry.js"></script>
<script src="outputs.js"></script>
<script src="windows.js"></script>
<script src="bar.js"></script>
<script src="clipboard.js"></script>
<script src="launcher.js"></script>
<script src="notifications.js"></script>
<script src="power.js"></script>
<script src="network.js"></script>
<script src="screencast.js"></script>
<script src="osk.js"></script>
<script src="commands.js"></script>
